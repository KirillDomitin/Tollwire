name: Build release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA on master with a successful push CI run
        required: true
        type: string

permissions:
  contents: read

# Building never connects to production. Server-side deployment has its own lock.
concurrency:
  group: release-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Verify exact SHA and successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full lowercase SHA required'; exit 1; }
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...master" --jq .status)
          [[ "$relation" == ahead || "$relation" == identical ]] || { echo 'SHA is not on master'; exit 1; }
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&branch=master&event=push&status=success&per_page=100" \
            | python3 -c 'import json, os, sys; print(sum(r["head_sha"] == os.environ["RELEASE_SHA"] and r["head_branch"] == "master" and r["event"] == "push" and r["status"] == "completed" and r["conclusion"] == "success" and r["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"] for r in json.load(sys.stdin)["workflow_runs"]))')
          [[ "$passed" -gt 0 ]] || { echo 'No successful push CI for this SHA'; exit 1; }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "images=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build production app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.source.outputs.images }}/app:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=release-app
          cache-to: type=gha,scope=release-app,mode=max
      - name: Build production web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          tags: ${{ steps.source.outputs.images }}/web:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,scope=release-web,mode=max
      - name: Build production bot
        uses: docker/build-push-action@v6
        with:
          context: bot
          platforms: linux/amd64
          load: true
          tags: ${{ steps.source.outputs.images }}/bot:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=release-bot
          cache-to: type=gha,scope=release-bot,mode=max
      - name: Verify the built production images
        env:
          IMAGES: ${{ steps.source.outputs.images }}
          SHA: ${{ steps.source.outputs.sha }}
        run: bash scripts/smoke-images.sh "$IMAGES/app:$SHA" "$IMAGES/web:$SHA" "$IMAGES/bot:$SHA"
      - name: Publish the tested images
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGES: ${{ steps.source.outputs.images }}
          SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          for role in app web bot; do docker push "$IMAGES/$role:$SHA"; done
      - name: Package immutable release
        env:
          IMAGES: ${{ steps.source.outputs.images }}
          SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          immutable() { docker image inspect "$IMAGES/$1:$SHA" --format '{{index .RepoDigests 0}}'; }
          heads=$(docker run --rm --network none "$IMAGES/app:$SHA" python -c \
            'from alembic.config import Config; from alembic.script import ScriptDirectory; print(" ".join(ScriptDirectory.from_config(Config("alembic.ini")).get_heads()))')
          read -r -a revisions <<< "$heads"
          python3 scripts/package-release.py --commit "$SHA" \
            --app "$(immutable app)" --web "$(immutable web)" --bot "$(immutable bot)" \
            --schema-heads "${revisions[@]}" --output "$RUNNER_TEMP/release"
          tar -czf "$RUNNER_TEMP/tollwire-$SHA.tar.gz" -C "$RUNNER_TEMP" release
          {
            echo "### Release $SHA"
            echo 'Production images passed isolated smoke checks. Production was not changed.'
            echo 'Download and extract the trusted artifact on the server, then run:'
            echo '```bash'
            echo 'TOLLWIRE_ROOT=/path/to/tollwire bash release/scripts/deploy.sh release'
            echo '```'
            echo 'Requires an existing installation, Python 3 and GHCR pull access. See docs/deploy/releases.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tollwire-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/tollwire-${{ steps.source.outputs.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
