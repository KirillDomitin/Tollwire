services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # Только localhost: на всех интерфейсах БД с паролем user/password видел бы любой сосед по сети.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vpn_panel
    volumes:
      - pg_data:/var/lib/postgresql/18/data

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - "127.0.0.1:6379:6379"  # Redis без пароля — только localhost

volumes:
  pg_data: