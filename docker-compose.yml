services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vpn_panel
    volumes:
      - pg_data:/var/lib/postgresql/18/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data: