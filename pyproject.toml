[project]
name = "amneziaadminpanel"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "asyncssh>=2.24.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
]
[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]            # какие группы правил включить

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
