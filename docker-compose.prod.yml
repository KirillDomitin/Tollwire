# Production: nginx (HTTPS) → api; worker; postgres; redis. api, worker и migrate — один образ (ТЗ §32).
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# --env-file нужен для подстановки ${...} ниже (пароль БД, порты). Секреты лежат только в .env.prod (не в git).
# Наружу открыт только nginx; api, postgres и redis доступны лишь внутри сетей compose.

# Своё имя проекта: иначе (по имени папки) он совпал бы с dev-compose — общие контейнеры и том pg_data.
name: vpn-panel

x-app-env: &app-env
  # Пароль БД задаётся один раз в .env.prod (POSTGRES_PASSWORD), URL собирается здесь. Пароль — без спецсимволов URL
  # (берите openssl rand -hex 32), иначе его пришлось бы кодировать.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://redis:6379/0
  COOKIE_SECURE: "true"
  LOG_FORMAT: json  # одна JSON-строка на событие: docker compose logs | jq, сборщики логов
  DOCS_ENABLED: "false"  # /api/openapi в проде не публикуем

# Ограничения для всех сервисов: процесс не может повысить себе права (setuid-бинарники и т.п.).
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]

x-app: &app
  <<: *hardened
  build: .
  image: vpn-panel:latest
  env_file: .env.prod
  environment: *app-env
  restart: unless-stopped
  # Приложению не нужны ни Linux-capabilities, ни запись в собственную файловую систему: взломанный процесс
  # не сможет ни поднять права, ни подложить себе файлы. /tmp — в памяти (asyncio/SSL иногда пишут туда).
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 512m

services:
  postgres:
    <<: *hardened
    # POSTGRES_IMAGE в .env.prod подменяет образ (сервер без доступа к реестру: образ привозят вручную, см. INSTALL).
    image: ${POSTGRES_IMAGE:-postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873}
    mem_limit: 1g
    environment:
      # Только свои переменные: секреты приложения (JWT, ENCRYPTION_KEY) контейнеру БД не передаются.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    volumes:
      - pg_data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    <<: *hardened
    image: ${REDIS_IMAGE:-redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0}
    mem_limit: 256m
    # AOF: очередь задач и блокировки переживают перезапуск Redis (потерянное всё равно подберёт requeue_jobs).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Одноразовый: применяет миграции и завершается. api и worker стартуют только после его успеха.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      # Доверять X-Forwarded-For только из сети edge, где из внешнего мира есть лишь nginx.
      FORWARDED_ALLOW_IPS: ${EDGE_SUBNET:-172.30.240.0/24}
    networks: [edge, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "src/worker.py"]
    # edge — ради выхода в интернет (SSH к VPN-серверам): сеть data внутренняя, без выхода наружу.
    networks: [edge, data]
    # SIGTERM → воркер дожидается текущей задачи. Зависшую дольше подберёт правило stale_jobs.
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Telegram-бот (профиль bot: поднимается, только если выбран при установке или `./panel bot enable`).
  # Секреты бота (токен Telegram, ключ бота) лежат в отдельном .env.bot и в api/worker не попадают.
  # Ходит в панель по внутренней сети (http://api:8000), в Telegram - исходящими запросами через edge.
  bot:
    <<: *hardened
    profiles: [bot]
    build: ./bot
    image: vpn-panel-bot:latest
    env_file:
      - path: .env.bot
        required: false  # Compose 2.24+: без файла сервис не стартует осмысленно, но `config` не падает
    environment:
      PANEL_URL: http://api:8000
      STATE_DIR: /data
    restart: unless-stopped
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    volumes:
      - bot_data:/data
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Файл обновляется, пока панель отвечает на heartbeat (см. tollwire_bot.__main__).
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.stat('/tmp/alive').st_mtime < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  nginx:
    <<: *hardened
    # nginx со статикой фронтенда внутри (frontend/Dockerfile: сборка на Node → только файлы в образе nginx).
    build: ./frontend
    image: vpn-panel-web:latest
    mem_limit: 128m
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.240.0/24}
  data:
    internal: true  # БД и Redis не видят интернет, интернет не видит их

volumes:
  pg_data:
  redis_data:
  bot_data:
