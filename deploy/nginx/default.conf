# HTTPS-терминация перед api. Сертификат и ключ — из ./certs на хосте (не в git):
#   certs/fullchain.pem, certs/privkey.pem

# Docker DNS: имя api перечитывается каждые 10 с, а не один раз при старте nginx
# (иначе после пересоздания контейнера api nginx продолжит слать запросы на старый IP).
resolver 127.0.0.11 valid=10s ipv6=off;

# Грубый лимит по IP на всё — отсекает флуд до Python. Точные правила (вход по IP и по учётке,
# refresh) — в api на Redis. 20 запросов/с в среднем, всплеск до 40 без задержки; сверх — 429.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

# Access-лог nginx тоже JSON и с тем же request_id, что уходит в api (X-Request-ID): одна строка nginx ↔
# строки api по одному id. Путь без query string, заголовки (Authorization, Cookie) не пишем.
log_format json_log escape=json '{"ts":"$time_iso8601","logger":"nginx","request_id":"$request_id",'
    '"client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream_s":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log json_log;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log json_log;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # API принимает только небольшие JSON: большие тела не нужны.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_req zone=per_ip burst=40 nodelay;
    limit_req_status 429;

    location / {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Перезаписываем, а не дописываем: заголовок, присланный клиентом, до api не доходит.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Свой id nginx перекрывает присланный клиентом: request_id в логах всегда от нашей стороны.
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}
